<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/base}">

<head>
    <title>Rewards</title>
</head>

<body>

<div layout:fragment="content" class="main-content">

    <h2>Your Reward Points</h2>

    <div class="card" style="max-width:400px; margin-top:20px; text-align:center;">

        <p style="font-size:18px;">Total Points</p>

        <h1 th:text="${points}" style="color:#2ecc71;"></h1>

    </div>

</div>

</body>
</html>
