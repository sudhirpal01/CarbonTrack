<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/base}">

<head>
    <title>Add Activity</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url('/images/bg2.jpg') no-repeat center center/cover;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 50, 0, 0.4);
            z-index: -1;
        }

        .activity-page {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 80vh;
            padding: 20px 0;
        }

        .activity-card {
            width: 100%;
            max-width: 520px;
            padding: 32px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
            color: #ffffff;
        }

        .activity-card h2 {
            margin: 0 0 24px;
            font-size: 2rem;
            letter-spacing: 0.4px;
            color: #000000;
        }

        .form-row {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }

        .form-row label {
            font-weight: 700;
            color: #000000;
        }

        .activity-card select,
        .activity-card input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            background: rgba(255, 255, 255, 0.11);
            color: #000000;
            outline: none;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .activity-card select:focus,
        .activity-card input:focus {
            border-color: rgba(134, 210, 255, 0.9);
            box-shadow: 0 0 0 3px rgba(134, 210, 255, 0.12);
            transform: translateY(-1px);
        }

        .submit-btn {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #66bb6a, #2e7d32);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 16px 24px rgba(46, 125, 50, 0.28);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 30px rgba(46, 125, 50, 0.35);
        }
    </style>
</head>

<body>

<div layout:fragment="content" class="main-content activity-page">

    <form method="post" action="/activity/add" class="activity-card">
        <h2>Add Activity</h2>

        <div class="form-row">
            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="CAR">Car Travel</option>
                <option value="BUS">Bus Travel</option>
                <option value="BIKE">Bike Travel</option>
                <option value="ELECTRICITY">Electricity Usage</option>
            </select>
        </div>

        <div class="form-row">
            <label for="value">Value</label>
            <input id="value" type="number" name="value" placeholder="Enter value" required>
        </div>

        <button type="submit" class="submit-btn">Add Activity</button>
    </form>

</div>

</body>
</html>
