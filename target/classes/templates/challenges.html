<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/base}">

<head>
    <title>Daily Challenges</title>
</head>

<body>

<div layout:fragment="content" class="main-content">

    <h2>Daily Challenges</h2>

    <div style="margin-top:20px;">
        <div th:each="c : ${list}" class="card" style="margin-bottom:15px;">

            <p th:text="${c.challengeText}" style="font-size:16px;"></p>

            <div th:if="${completedIds.contains(c.id)}">
                <button type="button" style="margin-top:10px; background:#777; color:white; cursor:default;">Completed</button>
            </div>
            <form th:if="${!completedIds.contains(c.id)}" method="post" action="/challenges/complete">
                <input type="hidden" name="challengeId" th:value="${c.id}">
                <button type="submit" style="margin-top:10px;">Complete</button>
            </form>

        </div>
    </div>

</div>

</body>
</html>
