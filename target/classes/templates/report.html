<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/base}">

<head>
    <title>Monthly Report</title>
</head>

<body>

<div layout:fragment="content" class="main-content">

    <h2>Monthly Report</h2>

    <div class="card" style="max-width:500px; margin-top:20px; text-align:center;">

        <p>Generate and download your monthly summary now.</p>
        <p><strong th:text="${username}">User</strong></p>
        <p>Total CO2: <span th:text="${totalCO2}">0</span> kg</p>
        <p>Reward Points: <span th:text="${points}">0</span></p>

        <a th:href="@{/report/download}" target="_blank">
            <button style="margin-top:10px;">Download PDF</button>
        </a>

    </div>

</div>

</body>
</html>
