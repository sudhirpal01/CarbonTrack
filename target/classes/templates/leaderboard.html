<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/base}">

<head>
    <title>Leaderboard</title>
</head>

<body>

<div layout:fragment="content" class="main-content">

    <h2>Leaderboard</h2>

    <table style="width:100%; margin-top:20px; background:white; border-radius:10px; overflow:hidden;">
        <tr style="background:#2c7be5; color:white;">
            <th style="padding:10px;">Rank</th>
            <th style="padding:10px;">Name</th>
            <th style="padding:10px;">Points</th>
        </tr>

        <tr th:each="entry, iterStat : ${entries}">
            <td style="padding:10px;" th:text="${iterStat.index + 1}"></td>
            <td style="padding:10px;" th:text="${entry.name}"></td>
            <td style="padding:10px;" th:text="${entry.points}"></td>
        </tr>
    </table>

</div>

</body>
</html>
