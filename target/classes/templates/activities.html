<html layout:decorate="~{layout/base}">
<div layout:fragment="content">

<h2>Your Activities</h2>

<table>
<tr>
    <th>Category</th>
    <th>Value</th>
    <th>Date</th>
</tr>

<tr th:each="a : ${activities}">
    <td th:text="${a.category}"></td>
    <td th:text="${a.value}"></td>
    <td th:text="${a.date}"></td>
</tr>

</table>

</div>
</html>
